services:
  postgres:
    image: postgres:17-alpine
    container_name: caller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caller}
      POSTGRES_DB: ${POSTGRES_DB:-caller}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-caller} -d ${POSTGRES_DB:-caller}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caller-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
